<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Golden Lotus Clinic | Yangon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* A sample customer site, used to test embedding and theme detection. */
      :root {
        --brand: #0f766e;
        --ink: #1f2937;
        --paper: #fbfaf7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 24px;
        border-bottom: 1px solid #e7e3da;
      }
      .logo { font-weight: 700; }
      .btn {
        background: var(--brand);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font: inherit;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 48px 24px;
        display: grid;
        gap: 40px;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        align-items: start;
      }
      h1 { font-size: 40px; line-height: 1.1; margin: 0 0 16px; }
      p { color: #6b7280; line-height: 1.6; }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">Golden Lotus Clinic</span>
      <button class="btn">Call 09 123 456 789</button>
    </header>
    <main>
      <section>
        <h1>Family care in the heart of Yangon.</h1>
        <p>
          This is a sample customer website. In development you can paste <code>localhost:3000/demo.html</code>
          into the studio to detect its brand. The widget on the right is embedded with one script tag.
        </p>
      </section>
      <section id="booking"></section>
    </main>

    <!-- Inline widget for the seeded demo clinic (pnpm db:setup). Its theme comes from the dashboard. -->
    <script src="/embed.js" data-business="golden-lotus-demo" data-target="#booking" async></script>
    <!-- Floating button variant -->
    <script src="/embed.js" data-business="golden-lotus-demo" data-mode="button" async></script>
    <script>
      window.addEventListener("booking-widget:booked", (e) => console.log("Booked!", e.detail));
    </script>
  </body>
</html>
